services:
  - type: web
    name: propnation-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node scripts/start.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: REDACTED_DATABASE_URL
      - key: SUPABASE_URL
        value: https://icqkfaurtrkqeqlcegvu.supabase.co
      - key: SUPABASE_KEY
        value: REDACTED_SUPABASE_KEY
      - key: JWT_SECRET
        value: REDACTED_JWT_SECRET
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://frontend-eta-beryl-ezh34u4upe.vercel.app,http://localhost:3000
