services:
  # 1. NestJS Backend API Web Service
  - type: web
    name: propfirm-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: AUTO_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: propfirm-database
          property: connectionString

  # 2. Next.js Frontend Web Service
  - type: web
    name: propfirm-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: propfirm-backend
          type: web
          property: host

databases:
  # 3. Managed PostgreSQL Database on Render
  - name: propfirm-database
    plan: free
    region: oregon
    databaseName: propfirm_rewards
    user: propfirm_user
