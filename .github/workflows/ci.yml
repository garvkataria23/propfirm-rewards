name: CI / Production Quality Gate

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"

      - name: Run Unit & Security Tests
        run: npm test
        env:
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars-long"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"

      - name: Build Backend (TypeScript Compilation)
        run: npm run build
        env:
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-chars-long"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"

  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Frontend Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.propfirmrewards.com"
